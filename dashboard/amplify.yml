# AWS Amplify Hosting build spec (monorepo: app root is dashboard/).
# In the Amplify console set the environment variables VITE_API_URL, VITE_AUTH_MODE=cognito,
# VITE_AWS_REGION, VITE_USER_POOL_ID, VITE_USER_POOL_CLIENT_ID (and optionally VITE_MAP_STYLE_URL).
version: 1
applications:
  - appRoot: dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
