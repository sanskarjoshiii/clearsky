[project]
name = "clearsky"
version = "0.1.0"
description = "ClearSky backend: WhatsApp farmer agent, matching engine, data layer"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "strands-agents[anthropic,openai,gemini]>=1.0",
    "boto3>=1.35",
    "aws-lambda-powertools[all]>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "moto[dynamodb,s3,sqs,ssm,server]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0",
    "types-python-dateutil",
    "types-PyYAML",
    "boto3-stubs[dynamodb,s3,ssm,sts,bedrock,polly,transcribe,location]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearsky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-3: Hindi/Punjabi text in strings and comments is intentional.
# E501: `ruff format` owns line length; long string literals (prompts, Devanagari) are left as written.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["clearsky"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["clearsky"]
